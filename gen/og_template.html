<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; color: #1d1d1f; position: relative; letter-spacing: -0.01em;
    background: linear-gradient(135deg, #ffffff 0%, #f5f7fc 55%, #e9effc 100%); }
  .dots { position: absolute; right: -40px; bottom: -40px; width: 620px; height: 420px;
    background-image: radial-gradient(circle, rgba(11,92,255,.20) 1.6px, transparent 1.9px); background-size: 18px 18px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 75% 85%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 60% 70% at 75% 85%, #000 30%, transparent 75%); }
  .in { position: absolute; left: 84px; top: 68px; right: 84px; }
  .logo { height: 78px; display: block; }
  .eyebrow { margin-top: 48px; color: #0B5CFF; font-weight: 700; font-size: 19px; }
  h1 { margin-top: 8px; font-size: 56px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.15; }
  h2 { margin-top: 6px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; color: #2b2b30; }
  p { margin-top: 18px; font-size: 21px; line-height: 1.5; color: #4a4a50; max-width: 1000px; word-break: keep-all; }
  .foot { position: absolute; left: 84px; bottom: 48px; display: flex; align-items: center; gap: 18px; font-size: 20px; color: #2b2b30; }
  .pill { background: #0B5CFF; color: #fff; font-weight: 800; padding: 10px 22px; border-radius: 999px; font-size: 21px; }
</style></head>
<body>
<div class="dots"></div>
<div class="in">
  <img class="logo" src="file:///home/claude/keli-site/assets/img/keli-logo.png" alt="KELI">
  <div class="eyebrow">K-University AI EdTech and Learning Initiative</div>
  <h1>한림대학교 KELI 플랫폼</h1>
  <h2>대학이 함께 만드는 AI 기반 고등교육 혁신 생태계</h2>
  <p>한림대가 개발하고 수업에서 검증한 AI 교육 서비스를 국내외 대학·기관과 함께 확산하는 고등교육 AI 공유 플랫폼</p>
</div>
<div class="foot"><span class="pill">keli-aied.org</span><span>한림대학교 KELI 사무국(AI교육혁신원 AI교육확산센터)</span></div>
</body></html>
