name: Deploy KELI site to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'   # 매일 03:17 KST — 포털 AI 강좌 수 재수집 후 재배포
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow (image resizing for imported photos)
        run: pip install --quiet pillow
      - name: Fetch live course count from ai.hallym.ac.kr
        run: python3 scripts/fetch_stats.py
      - name: Fetch [KELI] stories from aiadvcenter.csedu4all.com
        run: python3 scripts/fetch_events.py
      - name: Fetch KELI press releases from hallym.ac.kr
        run: python3 scripts/fetch_press.py
      - name: Fetch KELI videos from YouTube @HALLYMNEWS
        run: python3 scripts/fetch_videos.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
