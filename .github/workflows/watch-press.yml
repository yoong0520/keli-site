name: Watch press (near real-time)
# 1시간마다 한림대 보도자료(제목에 KELI·켈리)와 한국대학신문 기사를 확인해,
# 사이트에 올라가 있는 목록과 다르면 그때만 사이트 전체 배포(pages.yml)를 바로 실행한다.
on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분, 1시간마다
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # pages.yml 실행(workflow_dispatch)
concurrency:
  group: watch-press
  cancel-in-progress: false
env:
  TZ: Asia/Seoul
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest press lists
        run: |
          python3 scripts/fetch_press.py || true
          python3 scripts/fetch_unn.py || true
      - name: Compare with the live site and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sig() { python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('\n'.join(sorted(str(i.get('url') or i.get('id'))+'|'+str(i.get('title',''))+'|'+str(i.get('date','')) for i in d.get('items',[]))))" "$1" 2>/dev/null; }
          changed=0
          for f in press.live.json unn.live.json; do
            curl -fsS -m 30 "https://keli-aied.org/assets/$f?t=$(date +%s)" -o "/tmp/live-$f" || { echo "live $f unreadable"; continue; }
            new=$(sig "assets/$f"); old=$(sig "/tmp/live-$f")
            if [ -z "$new" ]; then echo "$f: fetch returned nothing, skip"; continue; fi
            if [ "$new" != "$old" ]; then echo "$f changed:"; diff <(echo "$old") <(echo "$new") | head -20; changed=1; else echo "$f: no change"; fi
          done
          if [ "$changed" = 1 ]; then
            if gh run list --workflow pages.yml --json status -q '.[].status' | grep -qE 'in_progress|queued'; then
              echo "a deploy is already running — it will pick up the new items"
            else
              gh workflow run pages.yml --ref main && echo "deploy started"
            fi
          fi
